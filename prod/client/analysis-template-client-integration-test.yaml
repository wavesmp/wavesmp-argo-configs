apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: client-integration-test
  namespace: wavesmp
  labels:
    app.kubernetes.io/version: 16b58716080d12cc8c18930834e4aa17683a6717
spec:
  args:
  - name: service-name
  - name: app-under-test
  metrics:
  - name: client-integration-test
    provider:
      job:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 600
          template:
            metadata:
              labels:
                app: client-integration-test
                app.kubernetes.io/version: 16b58716080d12cc8c18930834e4aa17683a6717
                app-under-test: "{{args.app-under-test}}"
                jettison-app: "{{args.app-under-test}}"
            spec:
              containers:
              - name: client-integration-test
                image: ghcr.io/wavesmp/wavesmp/client-integration-test:16b58716080d12cc8c18930834e4aa17683a6717
                args:
                - "./integration-test.sh"
                - "http://{{args.service-name}}"
              restartPolicy: Never
