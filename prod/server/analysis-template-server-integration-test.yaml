apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: server-integration-test
  namespace: wavesmp
  labels:
    app.kubernetes.io/version: cf4cac01d8f5a7cd2861058f04cbf0dde72f9c42
spec:
  args:
  - name: service-name
  - name: app-under-test
  metrics:
  - name: server-integration-test
    provider:
      job:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 600
          template:
            metadata:
              labels:
                app: server-integration-test
                app.kubernetes.io/version: cf4cac01d8f5a7cd2861058f04cbf0dde72f9c42
                app-under-test: "{{args.app-under-test}}"
                jettison-app: "{{args.app-under-test}}"
            spec:
              containers:
              - name: server-integration-test
                image: ghcr.io/wavesmp/wavesmp/server-integration-test:cf4cac01d8f5a7cd2861058f04cbf0dde72f9c42
                env:
                - name: WAVESMP_TEST_HOST
                  value: "{{args.service-name}}"
              restartPolicy: Never
