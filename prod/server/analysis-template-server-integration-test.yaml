apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: server-integration-test
  namespace: wavesmp
  labels:
    app.kubernetes.io/version: ef89d9b4a03be063b99287616e3c1d5284ed19e2
spec:
  args:
  - name: service-name
  - name: app-under-test
  metrics:
  - name: server-integration-test
    provider:
      job:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 600
          template:
            metadata:
              labels:
                app: server-integration-test
                app.kubernetes.io/version: ef89d9b4a03be063b99287616e3c1d5284ed19e2
                app-under-test: "{{args.app-under-test}}"
                jettison-app: "{{args.app-under-test}}"
            spec:
              containers:
              - name: server-integration-test
                image: ghcr.io/wavesmp/wavesmp/server-integration-test:ef89d9b4a03be063b99287616e3c1d5284ed19e2
                env:
                - name: WAVESMP_TEST_HOST
                  value: "{{args.service-name}}"
              restartPolicy: Never
